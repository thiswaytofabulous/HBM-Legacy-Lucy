[build]
  publish = "."
  functions = "netlify/functions"

# The summary PDF (netlify/lib/summary-pdf.js) uses pdfkit, which loads its own data files at
# runtime — ship it unbundled, and ship the Montserrat font files alongside the functions.
[functions]
  external_node_modules = ["pdfkit"]
  included_files = ["netlify/lib/fonts/**"]
